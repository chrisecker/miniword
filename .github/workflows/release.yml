name: Release builds

on:
  push:
    tags:
      - 'v*'
  # manual start (Actions tab, "Run workflow"): only the job "linux" runs,
  # its packages go to the run as a download instead of a release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ".[full]" pyinstaller
      - name: Build with PyInstaller
        run: >
          pyinstaller miniword.py --name MiniWord --windowed --onedir
          --icon miniword/icons/miniword.ico
          --add-data "miniword/icons;miniword/icons"
          --add-data "miniword/hyphenation/patterns;miniword/hyphenation/patterns"
          --add-data "miniword/plugins;miniword/plugins"
          --hidden-import mistune
          --manifest installer/miniword.manifest
      - name: Bundle cairo (wxPython >=4.2.2 dropped the bundled DLL upstream)
        run: powershell -File installer/bundle_cairo_windows.ps1 dist/MiniWord
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        run: ISCC /DMyAppVersion=${{ github.ref_name }} installer/miniword.iss
      - uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe

  macos:
    needs: windows
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ".[full]" pyinstaller
      - name: Build .icns from iconset
        run: iconutil -c icns miniword/icons/miniword.iconset -o miniword/icons/miniword.icns
      - name: Build with PyInstaller
        # cairocffi needs libcairo; fontfinder.py shells out to fc-match for
        # font resolution -- both come from Homebrew on macOS, not wxPython
        run: |
          brew install cairo fontconfig dylibbundler
          pyinstaller miniword.py --name MiniWord --windowed --onedir \
            --icon miniword/icons/miniword.icns \
            --add-data "miniword/icons:miniword/icons" \
            --add-data "miniword/hyphenation/patterns:miniword/hyphenation/patterns" \
            --add-data "miniword/plugins:miniword/plugins" \
            --hidden-import mistune
      - name: File types .txl and .md
        run: python installer/macos_file_types.py dist/MiniWord.app
      - name: Bundle cairo (PyInstaller can't see its dlopen-by-name load)
        run: bash installer/bundle_cairo_macos.sh dist/MiniWord.app
      - name: Bundle fontconfig (PyInstaller can't see the fc-match subprocess call)
        run: bash installer/bundle_fontconfig_macos.sh dist/MiniWord.app
      - name: Re-sign the bundle
        # PyInstaller signs the .app before the steps above add files to it,
        # which leaves its seal stale -- macOS then refuses to launch it at
        # all ("MiniWord is damaged"), not even with an Open Anyway override.
        # No --deep: the added files are already individually signed by the
        # bundling scripts, and --deep re-signing them errors out on some
        # compiled extensions (a known macOS codesign quirk); only the outer
        # bundle's own seal needs to be recomputed.
        run: codesign --force --sign - dist/MiniWord.app
      - name: Create .dmg
        run: |
          mkdir -p dist/dmg
          cp -R dist/MiniWord.app dist/dmg/
          hdiutil create -volname MiniWord -srcfolder dist/dmg -ov -format UDZO dist/MiniWord-${{ github.ref_name }}.dmg
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/MiniWord-*.dmg

  linux:
    # .deb and .rpm for amd64 and arm64, see packaging/linux/nfpm.yaml.
    # Independent of the other jobs.
    runs-on: ubuntu-latest
    env:
      NFPM_VERSION: 2.41.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Desktop entry and file type (from miniword/desktop.py)
        run: >
          PYTHONPATH=. python packaging/linux/make_desktop_files.py build/linux
      - name: Install nfpm
        run: |
          url=https://github.com/goreleaser/nfpm/releases/download
          curl -sSfL -o nfpm.tar.gz \
            "$url/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf nfpm.tar.gz nfpm
      - name: Build .deb and .rpm per architecture
        # the code as pip installs it, plus the uharfbuzz and mistune
        # wheels of the architecture; the version from
        # miniword/__init__.py (for a tag, the job "pypi" checks it)
        run: |
          export VERSION=$(python -c \
            "import miniword; print(miniword.__version__)")
          mkdir -p dist
          for arch in amd64:x86_64 arm64:aarch64; do
            stage=build/linux/stage
            rm -rf $stage
            pip install --no-deps --no-compile --target $stage .
            pip install --no-deps --no-compile --target $stage \
              --only-binary=:all: --platform manylinux_2_17_${arch#*:} \
              --python-version 3.11 --implementation cp \
              uharfbuzz "mistune>=3"
            rm -rf $stage/bin
            sed "s/^arch: .*/arch: ${arch%:*}/" packaging/linux/nfpm.yaml \
              > build/linux/nfpm.yaml
            ./nfpm package -f build/linux/nfpm.yaml -p deb -t dist/
            ./nfpm package -f build/linux/nfpm.yaml -p rpm -t dist/
          done
      - name: Smoke test - install the amd64 packages in containers
        # fails if a distribution lacks a dependency
        run: |
          for image in debian:12 debian:13 ubuntu:24.04 ubuntu:26.04; do
            docker run --rm -v "$PWD:/src" \
              -e DEBIAN_FRONTEND=noninteractive $image sh -c \
              "apt-get update -q &&
               apt-get install -y -q /src/dist/*_amd64.deb &&
               python3 /src/packaging/linux/smoke_test.py"
          done
          docker run --rm -v "$PWD:/src" fedora:42 sh -c \
            "dnf install -y -q /src/dist/*.x86_64.rpm &&
             python3 /src/packaging/linux/smoke_test.py"
      - if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm

  pypi:
    needs: [windows, macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check pyproject.toml version matches tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(python -c "import ast, pathlib; src=pathlib.Path('miniword/__init__.py').read_text(); print(next(ast.literal_eval(n.value) for n in ast.walk(ast.parse(src)) if isinstance(n, ast.Assign) and any(getattr(t,'id','')=='__version__' for t in n.targets)))")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $pkg_version"
            exit 1
          fi
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
