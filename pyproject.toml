[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "miniword"
version = "0.2.2"
description = "A minimal word processor in Python"
readme = "README.md"
requires-python = ">=3.9"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING"]
dependencies = [
    "wxPython>=4.0",
    "cairocffi",
    "mistune>=3",
    "uharfbuzz",
]

[project.optional-dependencies]
full = [
    "fonttools",  # font fallback for non-Latin scripts on Windows
]

[project.urls]
Homepage = "https://codeberg.org/chrisecker/miniword"

[tool.setuptools.packages.find]
include = ["miniword*"]
exclude = ["miniword.tests*"]

[tool.setuptools.package-data]
miniword = ["icons/*.svg", "hyphenation/patterns/*"]

[project.scripts]
miniword = "miniword.__main__:main"
